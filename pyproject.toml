[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoids"
version = "0.1.0"
description = "Humanoid_Tasks workspace: task definitions, validation, and animation-preview tooling for manufacturing simulation."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ManSim/Humanoid_Tasks" }]
dependencies = []

[project.optional-dependencies]
catalog = ["openpyxl>=3.1"]

[project.scripts]
humanoids = "humanoids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
